name: Windows build

on:
  push:
    branches: [main, 'opencap/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure
        shell: pwsh
        run: |
          $suffix = ''
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME }
                 elseif ($env:GITHUB_REF_NAME.StartsWith('opencap/release/')) { $env:GITHUB_REF_NAME.Split('/')[-1] }
          if ($tag) {
            if ($tag -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-([0-9A-Za-z.-]+))?$') {
              throw 'Expected an OpenCap SemVer tag.'
            }
            $suffix = $Matches[1]
          }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DOPENCAP_PRERELEASE=$suffix"
          exit $LASTEXITCODE
      - name: Build all components
        run: cmake --build build --config Release --parallel
      - name: Run automated checks
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install package
        run: cmake --install build --config Release --prefix out/OpenCap
      - name: Verify per-user installer and rollback
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'OpenCap-Install-Check'
          $installer = './out/OpenCap/Install-OpenCap.ps1'
          & $installer -Destination $dest -SkipShortcut
          if (!(Test-Path -LiteralPath (Join-Path $dest 'OpenCap.exe'))) { throw 'Install did not create the desktop app.' }
          & $installer -Destination $dest -SkipShortcut
          & $installer -Destination $dest -SkipShortcut -Action Rollback
          & $installer -Destination $dest -SkipShortcut -Action Remove
          if ((Test-Path -LiteralPath $dest) -or (Test-Path -LiteralPath "$dest.previous")) {
            throw 'Removal left a package directory.'
          }
      - name: Verify release update and rollback in Windows PowerShell
        shell: powershell
        run: |
          ./tests/update.ps1 -Package ./out/OpenCap
          exit 0
      - name: Verify SteamVR setup and UDCAP restoration
        shell: powershell
        run: ./tests/steamvr-setup.ps1 -Package ./out/OpenCap
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCap-Windows-x64
          path: out/OpenCap
          if-no-files-found: error
  release:
    needs: windows
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/opencap/release/v'))
    permissions:
      contents: write
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenCap-Windows-x64
          path: package
      - name: Prepare the Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPENCAP_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content -LiteralPath 'package/OpenCap.version' -Raw).Trim()
          $tag = $env:OPENCAP_TAG.Split('/')[-1]
          if ($tag -cne "v$version") { throw 'The Git tag and package version must match.' }
          if ($env:GITHUB_REF_TYPE -eq 'branch') {
            $tagSha = gh api "repos/$env:GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>$null
            if ($LASTEXITCODE -ne 0) {
              gh api "repos/$env:GH_REPO/git/refs" --method POST -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA" | Out-Null
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } elseif ($tagSha -cne $env:GITHUB_SHA) {
              throw 'The release tag points to a different commit. Use a new version.'
            }
          }
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { return }
          $archive = 'OpenCap-Windows-x64.zip'
          Compress-Archive -Path 'package/*' -DestinationPath $archive
          $flags = @('--verify-tag', '--generate-notes')
          if ($version.Contains('-')) { $flags += @('--prerelease', '--latest=false') }
          if ($env:GITHUB_REF_TYPE -ne 'branch' -or !$version.Contains('-')) { $flags += '--draft' }
          gh release create $tag $archive @flags
          exit $LASTEXITCODE
